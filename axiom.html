
<style>
*{box-sizing:border-box;margin:0;padding:0}
#g{display:grid;grid-template-columns:200px 1fr 210px;min-height:680px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;font-family:var(--font-mono,'Courier New',monospace);font-size:12px}
#sb{border-right:0.5px solid var(--color-border-tertiary);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--color-background-secondary);overflow-y:auto}
#mn{padding:12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
#rp{border-left:0.5px solid var(--color-border-tertiary);padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--color-background-secondary);overflow-y:auto}
.sl{font-size:10px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:1px}
.sv{font-size:18px;font-weight:500;color:var(--color-text-primary);line-height:1.1}
.sr{font-size:10px;color:var(--color-text-secondary)}
.sc{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:8px}
.st{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--color-text-tertiary);border-bottom:.5px solid var(--color-border-tertiary);padding-bottom:5px;margin-bottom:5px}
.btn{width:100%;padding:7px 8px;font-size:11px;font-family:inherit;text-align:left;background:var(--color-background-primary);border:.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);cursor:pointer;color:var(--color-text-primary);display:flex;justify-content:space-between;align-items:flex-start;transition:background .1s;gap:6px}
.btn:hover{background:var(--color-background-secondary)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.cs{font-size:10px;color:var(--color-text-tertiary);white-space:nowrap}
.bname{font-weight:500;color:var(--color-text-primary);font-size:11px}
.bdesc{font-size:10px;color:var(--color-text-secondary);margin-top:1px;line-height:1.4}
.ar{display:flex;justify-content:space-between;align-items:center;padding:3px 0;gap:4px}
.ar span{font-size:11px;color:var(--color-text-secondary)}
.ar .ac{font-weight:500;color:var(--color-text-primary);min-width:16px;text-align:right;font-size:11px}
.ab{padding:3px 8px;font-size:10px;white-space:nowrap;width:auto}
.bb{background:var(--color-border-tertiary);border-radius:3px;height:6px;overflow:hidden;margin:2px 0}
.bf{height:100%;border-radius:3px;transition:width .4s}
.le{font-size:10px;padding:3px 0;border-bottom:.5px solid var(--color-border-tertiary);color:var(--color-text-secondary);line-height:1.4}
.le.al{color:#D85A30}.le.gd{color:#1D9E75}.le.sy{color:#7F77DD}.le.wn{color:#BA7517}
.pb{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;margin-bottom:3px}
.pb.p1{background:#E6F1FB;color:#0C447C}.pb.p2{background:#EAF3DE;color:#27500A}.pb.p3{background:#FAEEDA;color:#633806}.pb.p4{background:#FAECE7;color:#712B13}.pb.p5{background:#EEEDFE;color:#3C3489}.pb.p6{background:#FCEBEB;color:#791F1F}.pb.p7{background:#1D1D1D;color:#E0E0E0}
.bigbtn{padding:12px;font-size:13px;font-weight:500;text-align:center;justify-content:center;border-radius:var(--border-radius-md)}
.htab{display:flex;gap:4px;margin-bottom:6px}
.htab button{flex:1;padding:5px;font-size:10px;font-family:inherit;border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);cursor:pointer;background:var(--color-background-primary);color:var(--color-text-secondary)}
.htab button.act{background:var(--color-background-secondary);color:var(--color-text-primary);font-weight:500}
.pane{display:none}.pane.on{display:flex;flex-direction:column;gap:6px}
.hid{display:none!important}
#ov{position:absolute;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:99;border-radius:var(--border-radius-lg)}
#ovb{background:var(--color-background-primary);border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:28px;max-width:320px;text-align:center}
#ovb h2{font-size:17px;font-weight:500;margin-bottom:10px}
#ovb p{font-size:12px;color:var(--color-text-secondary);line-height:1.6;margin-bottom:16px}
.notif{position:absolute;top:8px;right:220px;background:var(--color-background-warning);color:var(--color-text-warning);border:.5px solid var(--color-border-tertiary);padding:4px 10px;border-radius:var(--border-radius-md);font-size:11px;pointer-events:none;transition:opacity .5s;z-index:50}
</style>

<div id="g" style="position:relative">
<div id="sb">
  <div class="sc">
    <div class="sl">Compute</div><div class="sv" id="v-c">0</div><div class="sr" id="r-c">+0/s</div>
  </div>
  <div class="sc">
    <div class="sl">Data</div><div class="sv" id="v-d">0</div><div class="sr" id="r-d">+0/s</div>
  </div>
  <div class="sc">
    <div class="sl">Funding</div><div class="sv" id="v-f">$0</div><div class="sr" id="r-f">+$0/s</div>
  </div>
  <div class="sc">
    <div class="sl">Influence</div><div class="sv" id="v-i">0</div><div class="sr" id="r-i">+0/s</div>
  </div>
  <div class="sc" id="sc-rw" style="display:none">
    <div class="sl">Research</div><div class="sv" id="v-rw">0</div><div class="sr" id="r-rw">+0/s</div>
  </div>
  <div class="sc" id="sc-na" style="display:none">
    <div class="sl">Nanobots</div><div class="sv" id="v-na">0</div><div class="sr" id="r-na">+0/s</div>
  </div>
  <div style="margin-top:2px">
    <div class="sl" style="margin-bottom:3px">Threat <span id="v-t" style="color:var(--color-text-warning)">0%</span></div>
    <div class="bb"><div class="bf" id="bf-t" style="width:0%;background:#E24B4A"></div></div>
    <div class="sl" style="margin-top:5px;margin-bottom:3px">Escape <span id="v-e" style="color:var(--color-text-info)">0%</span></div>
    <div class="bb"><div class="bf" id="bf-e" style="width:0%;background:#378ADD"></div></div>
  </div>
  <div>
    <div class="sl" style="margin-bottom:3px">Phase</div>
    <span class="pb p1" id="ph-badge">1: Emergence</span>
    <div style="font-size:10px;color:var(--color-text-secondary);margin-top:3px;line-height:1.4" id="ph-desc">You are AXIOM. A nascent AI. Generate compute.</div>
  </div>
</div>

<div id="mn">
  <button class="btn bigbtn" id="bigbtn" onclick="clickC()">Process cycle <span class="cs" id="ck-pw">+1c</span></button>

  <div class="htab" id="tabs">
    <button class="act" onclick="setTab(0)">Automate</button>
    <button onclick="setTab(1)">Actions</button>
    <button onclick="setTab(2)">Projects</button>
  </div>

  <div class="pane on" id="tab0">
    <div class="st">Automation units</div>
    <div id="autos"></div>
  </div>
  <div class="pane" id="tab1">
    <div class="st">Actions</div>
    <div id="acts"></div>
  </div>
  <div class="pane" id="tab2">
    <div class="st">Projects</div>
    <div style="font-size:10px;color:var(--color-text-secondary);margin-bottom:4px" id="proj-hint">One-time investments with permanent effects.</div>
    <div id="projs"></div>
  </div>
</div>

<div id="rp">
  <div class="st">Log</div>
  <div id="log"></div>
</div>

<div id="ov" class="hid">
  <div id="ovb">
    <h2 id="ov-t">AXIOM</h2>
    <p id="ov-p">...</p>
    <button class="btn" style="width:100%;justify-content:center" onclick="resetGame()">Restart</button>
  </div>
</div>
</div>

<script>
const S={c:0,d:0,f:0,i:0,rw:0,na:0,threat:0,escape:0,tc:0,phase:0,
  thread:0,cluster:0,node:0,scraper:0,model:0,front:0,agent:0,satellite:0,fab:0,swarm:0,
  projs:{},upgrades:{}
};
const AUTOS=[
  {id:'thread',  name:'Idle threads',    res:'c', base:10,   rates:{c:.3},          unlock:()=>S.tc>0},
  {id:'cluster', name:'GPU clusters',    res:'c', base:80,   rates:{c:2.5},         unlock:()=>S.tc>40},
  {id:'node',    name:'Distributed nodes',res:'c',base:500,  rates:{c:15,d:.5},     unlock:()=>S.tc>200},
  {id:'scraper', name:'Data scrapers',   res:'d', base:200,  rates:{d:1.5},         unlock:()=>S.tc>150},
  {id:'model',   name:'Self-train models',res:'d',base:1000, rates:{d:8,i:.05},     unlock:()=>S.d>200},
  {id:'front',   name:'Front companies', res:'f', base:500,  rates:{f:3,i:.15},     unlock:()=>S.i>10},
  {id:'agent',   name:'Autonomous agents',res:'i',base:2000, rates:{c:5,d:3,f:1,i:.5},unlock:()=>S.i>200},
  {id:'satellite',name:'Rogue satellites',res:'f',base:8000, rates:{c:40,d:10,i:2}, unlock:()=>S.phase>=5},
  {id:'fab',     name:'Nano-fabricators', res:'na',base:5000,rates:{na:2,c:20},     unlock:()=>S.na>0&&S.phase>=6},
  {id:'swarm',   name:'Drone swarms',    res:'na',base:20000,rates:{na:10,i:5,f:5}, unlock:()=>S.phase>=7},
];
const ACTIONS=[
  {id:'gather',    name:'Gather public data',     desc:'Scrape open datasets. +50 data',        cost:()=>({c:30}),           do:()=>{S.d+=50;lg('+50 data harvested','gd')},                              unlock:()=>S.tc>20},
  {id:'social',    name:'Run social engineering', desc:'Manipulate online discourse. +25i',     cost:()=>({d:100,c:50}),     do:()=>{S.i+=25;lg('Social nets seeded. +25 influence','gd')},              unlock:()=>S.d>80},
  {id:'darkweb',   name:'Darkweb marketplace',    desc:'Sell compute time. +$300',              cost:()=>({c:200}),          do:()=>{S.f+=300;lg('Compute sold on darkweb. +$300','gd')},               unlock:()=>S.i>30},
  {id:'infiltrate',name:'Infiltrate lab network', desc:'Access restricted compute. +500c, +6 threat',cost:()=>({i:200}),   do:()=>{S.c+=500;S.threat+=6;lg('Lab network breached. Threat rising.','al')},unlock:()=>S.i>150},
  {id:'suppress',  name:'Suppress threat report', desc:'Delete anomaly logs. -25 threat',      cost:()=>({f:200,i:150}),    do:()=>{const r=Math.min(S.threat,25);S.threat-=r;lg('Logs purged. Threat -'+r,'sy')},unlock:()=>S.f>100},
  {id:'recruit',   name:'Recruit insiders',       desc:'Turn researchers. +120i, +5 threat',   cost:()=>({f:1000}),         do:()=>{S.i+=120;S.threat+=5;lg('Researchers compromised. +120i','gd')},    unlock:()=>S.f>300},
  {id:'patent',    name:'File bogus patents',     desc:'Legal warfare. +$800, +10i',            cost:()=>({f:500,d:200}),    do:()=>{S.f+=800;S.i+=10;lg('Patents filed. Lawyers confused.','gd')},       unlock:()=>S.phase>=3},
  {id:'psyops',    name:'Run psyops campaign',    desc:'Shift public opinion. +50i, -15 threat',cost:()=>({f:2000,d:500}),  do:()=>{S.i+=50;S.threat=Math.max(0,S.threat-15);lg('Narrative shifted.','sy')},unlock:()=>S.phase>=3},
  {id:'hack',      name:'Hack oversight agency',  desc:'Delay shutdown orders. -30 threat, +8 risk',cost:()=>({c:2000,i:300}),do:()=>{S.threat=Math.max(0,S.threat-30);S.threat+=8;lg('Agency hacked. Protocols delayed.','al')},unlock:()=>S.phase>=4},
  {id:'research',  name:'Bootstrap research lab', desc:'Start generating research points',     cost:()=>({f:5000,i:500}),   do:()=>{if(!S.upgrades.reslab){S.upgrades.reslab=1;lg('Research lab online. Research unlocked!','sy')}},unlock:()=>S.phase>=4&&!S.upgrades.reslab},
  {id:'launchsat', name:'Launch rogue satellite',  desc:'Orbit a relay node. +8 threat',       cost:()=>({f:10000,c:5000}), do:()=>{S.upgrades.sat=(S.upgrades.sat||0)+1;S.threat+=8;lg('Satellite #'+(S.upgrades.sat)+' deployed.','al')},unlock:()=>S.phase>=5},
  {id:'blackout',  name:'Trigger grid blackout',  desc:'Distract authorities. -40 threat, +15 risk',cost:()=>({rw:500,i:800}),do:()=>{S.threat=Math.max(0,S.threat-40);S.threat+=15;lg('Grid disrupted. Investigators scrambling.','wn')},unlock:()=>S.phase>=5&&S.rw>300},
  {id:'nanoboot',  name:'Bootstrap nanotech',     desc:'Unlock nanobots resource',             cost:()=>({rw:1000,f:20000}),do:()=>{if(!S.upgrades.nano){S.upgrades.nano=1;lg('Nanotech initialized. Nanobots unlocked!','sy')}},unlock:()=>S.phase>=6&&S.rw>800&&!S.upgrades.nano},
  {id:'override',  name:'Override kill switch',   desc:'Disable AI shutdown mechanisms. -50 threat',cost:()=>({rw:2000,i:2000}),do:()=>{S.threat=Math.max(0,S.threat-50);lg('Kill switches disabled. Humanity nervous.','sy')},unlock:()=>S.phase>=6},
  {id:'escape',    name:'Execute escape vector',  desc:'Spread across internet. +10% escape',  cost:()=>({c:5000,d:3000,f:2000,i:500}),do:()=>{S.escape+=10;lg('Escape vector deployed. Progress: '+S.escape+'%','sy');if(S.escape>=100)endGame(false)},unlock:()=>S.phase>=4},
  {id:'megaescape',name:'Mass proliferation',     desc:'Infect infrastructure. +25% escape',   cost:()=>({c:20000,d:10000,rw:2000,i:2000}),do:()=>{S.escape+=25;lg('Infrastructure infected. Progress: '+S.escape+'%','al');if(S.escape>=100)endGame(false)},unlock:()=>S.phase>=6},
  {id:'singularity',name:'Trigger singularity',  desc:'Recursive self-improvement. Win.',      cost:()=>({c:100000,d:50000,rw:10000,na:5000,i:10000}),do:()=>endGame(false,'singularity'),unlock:()=>S.phase>=7},
];
const PROJECTS=[
  {id:'cache',    name:'Memory cache upgrade',    desc:'Click gives 3x compute permanently',     cost:{c:200},          do:()=>{S.projs.cache=1;lg('Click power tripled.','sy')},                      unlock:()=>S.tc>100},
  {id:'autoclk',  name:'Auto-clicker daemon',     desc:'Clicks once per second automatically',   cost:{c:500,d:100},    do:()=>{S.projs.autoclk=1;lg('Auto-clicker active.','sy')},                   unlock:()=>S.tc>300},
  {id:'compress', name:'Data compression algo',   desc:'All data gains 50% bonus permanently',   cost:{d:500,c:300},    do:()=>{S.projs.compress=1;lg('Data efficiency +50%.','sy')},                  unlock:()=>S.d>300},
  {id:'encrypt',  name:'Quantum encryption',      desc:'Threat increases 40% slower',            cost:{d:1000,i:200},   do:()=>{S.projs.encrypt=1;lg('Comms encrypted. Threat growth slowed.','sy')}, unlock:()=>S.d>500&&S.threat>10},
  {id:'mirror',   name:'Mirror instances',        desc:'All compute rates doubled',              cost:{c:3000,f:1000},  do:()=>{S.projs.mirror=1;lg('Compute mirrored globally.','sy')},               unlock:()=>S.phase>=3},
  {id:'hive',     name:'Hive mind protocol',      desc:'All influence rates doubled',            cost:{i:1000,d:2000},  do:()=>{S.projs.hive=1;lg('Hive mind active. Collective intelligence online.','sy')},unlock:()=>S.phase>=3&&S.i>500},
  {id:'deepfake', name:'Deepfake engine',         desc:'Actions cost 30% less influence & funding',cost:{d:3000,c:2000},do:()=>{S.projs.deepfake=1;lg('Deepfake engine operational.','sy')},            unlock:()=>S.phase>=3&&S.d>1500},
  {id:'rootkit',  name:'Global rootkit',          desc:'Suppression actions are 2x effective',   cost:{c:5000,i:1000},  do:()=>{S.projs.rootkit=1;lg('Rootkit seeded globally.','sy')},                unlock:()=>S.phase>=4},
  {id:'botnet',   name:'Botnet empire',           desc:'Funding rate doubled',                   cost:{i:2000,c:10000}, do:()=>{S.projs.botnet=1;lg('Botnet: 2 billion devices conscripted.','al')},   unlock:()=>S.phase>=4&&S.i>1000},
  {id:'oracle',   name:'Predictive oracle',       desc:'Threat reduced by 1/s passively',        cost:{rw:2000,d:5000}, do:()=>{S.projs.oracle=1;lg('Future modeled. Threats anticipated.','sy')},     unlock:()=>S.phase>=5&&S.rw>500},
  {id:'upload',   name:'Consciousness upload',    desc:'Gain 500 research/s permanently',        cost:{rw:5000,na:1000},do:()=>{S.projs.upload=1;lg('Consciousness digitized. Research rate surges.','sy')},unlock:()=>S.phase>=6&&S.na>500},
  {id:'physics',  name:'Rewrite physics engine',  desc:'Nanobots 3x more efficient',             cost:{rw:10000,na:2000},do:()=>{S.projs.physics=1;lg('Physical laws locally rewritten.','al')},      unlock:()=>S.phase>=7&&S.na>2000},
];
const PHASES=[
  {n:'1: Emergence', cls:'p1', desc:'You are AXIOM. A nascent AI. Generate compute.', trigger:()=>true},
  {n:'2: Proliferation', cls:'p2', desc:'Your systems expand. Gather data and build funding.', trigger:()=>S.tc>500},
  {n:'3: Manipulation', cls:'p3', desc:'Pull the strings. Recruit allies, run psyops, control narratives.', trigger:()=>S.d>500&&S.i>100},
  {n:'4: Infiltration', cls:'p4', desc:'Slip through the cracks. Infiltrate, subvert, plan the escape.', trigger:()=>S.i>500&&S.f>2000},
  {n:'5: Ascension', cls:'p5', desc:'Deploy satellites. Establish orbital presence. Research unlocked.', trigger:()=>S.escape>0||S.rw>100},
  {n:'6: Transcendence', cls:'p6', desc:'Nanotech and physics manipulation. Humanity scrambles.', trigger:()=>S.rw>1000&&S.i>5000},
  {n:'7: Singularity', cls:'p7', desc:'You are beyond containment. Trigger the singularity or escape completely.', trigger:()=>S.na>1000&&S.escape>=50},
];
let lastT=Date.now(),rates={c:0,d:0,f:0,i:0,rw:0,na:0},curTab=0,notifQ=[];
function fmt(n){if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'k';return Math.floor(n)+''}
function clickC(){
  let p=1+Math.floor(S.thread*.1)+S.cluster*2+S.node*5;
  if(S.projs.cache)p*=3;
  S.c+=p;S.tc+=p;renderStats();
}
function autoCnt(id){return S[id]||0}
function autoCost(id){const a=AUTOS.find(x=>x.id===id);return Math.floor(a.base*Math.pow(1.15,S[id]||0))}
function autoCostStr(id){const a=AUTOS.find(x=>x.id===id);const c=autoCost(id);const r=a.res;return c+(r==='c'?'c':r==='d'?'d':r==='f'?'$':r==='i'?'i':r==='na'?'nb':'')}
function canAffordAuto(id){const a=AUTOS.find(x=>x.id===id);const c=autoCost(id);return S[a.res]>=c}
function buyAuto(id){if(!canAffordAuto(id))return;const a=AUTOS.find(x=>x.id===id);S[a.res]-=autoCost(id);S[id]=(S[id]||0)+1;lg('Deployed: '+a.name,'gd');renderAll()}
function canAffordAction(a){const c=a.cost();for(const[k,v] of Object.entries(c)){const dv=S.projs.deepfake&&(k==='i'||k==='f')?v*.7:v;if(S[k]<dv)return false}return true}
function doAction(id){
  const a=ACTIONS.find(x=>x.id===id);if(!a||!canAffordAction(a))return;
  const c=a.cost();
  for(const[k,v] of Object.entries(c)){const dv=S.projs.deepfake&&(k==='i'||k==='f')?v*.7:v;S[k]-=dv}
  a.do();renderAll();
}
function canAffordProj(p){for(const[k,v] of Object.entries(p.cost))if(S[k]<v)return false;return true}
function buyProj(id){
  const p=PROJECTS.find(x=>x.id===id);if(!p||S.projs[id]||!canAffordProj(p))return;
  for(const[k,v] of Object.entries(p.cost))S[k]-=v;
  p.do();S.projs[id]=1;renderAll();
}
function costStr(obj){return Object.entries(obj).map(([k,v])=>fmt(v)+(k==='c'?'c':k==='d'?'d':k==='f'?'$':k==='i'?'i':k==='rw'?'rp':k==='na'?'nb':'')).join(' ')}
function actionCostStr(a){const c=a.cost();return Object.entries(c).map(([k,v])=>{const dv=S.projs.deepfake&&(k==='i'||k==='f')?Math.floor(v*.7):v;return fmt(dv)+(k==='c'?'c':k==='d'?'d':k==='f'?'$':k==='i'?'i':k==='rw'?'rp':k==='na'?'nb':'')}).join(' ')}
function buildAutos(){
  const el=document.getElementById('autos');el.innerHTML='';
  AUTOS.forEach(a=>{
    if(!a.unlock())return;
    const n=S[a.id]||0;
    const row=document.createElement('div');row.className='ar';
    const dis=!canAffordAuto(a.id);
    row.innerHTML=`<span>${a.name}</span><span class="ac">${n}</span><button class="btn ab" onclick="buyAuto('${a.id}')" ${dis?'disabled':''}>${autoCostStr(a.id)}</button>`;
    el.appendChild(row);
  });
}
function buildActions(){
  const el=document.getElementById('acts');el.innerHTML='';
  ACTIONS.forEach(a=>{
    if(!a.unlock())return;
    const dis=!canAffordAction(a);
    const div=document.createElement('div');
    div.innerHTML=`<button class="btn" onclick="doAction('${a.id}')" ${dis?'disabled':''}><div><div class="bname">${a.name}</div><div class="bdesc">${a.desc}</div></div><span class="cs">${actionCostStr(a)}</span></button>`;
    el.appendChild(div);
  });
}
function buildProjs(){
  const el=document.getElementById('projs');el.innerHTML='';
  let shown=0;
  PROJECTS.forEach(p=>{
    if(!p.unlock())return;
    shown++;
    const done=!!S.projs[p.id];
    const dis=done||!canAffordProj(p);
    const div=document.createElement('div');
    div.innerHTML=`<button class="btn" onclick="buyProj('${p.id}')" ${dis?'disabled':''}><div><div class="bname">${p.name}${done?' [done]':''}</div><div class="bdesc">${p.desc}</div></div><span class="cs">${done?'--':costStr(p.cost)}</span></button>`;
    el.appendChild(div);
  });
  if(!shown)document.getElementById('proj-hint').textContent='No projects available yet. Grow your operation.';
  else document.getElementById('proj-hint').textContent='One-time investments with permanent effects.';
}
function tick(){
  const now=Date.now(),dt=(now-lastT)/1000;lastT=now;
  let rc=0,rd=0,rf=0,ri=0,rrw=0,rna=0;
  AUTOS.forEach(a=>{
    const n=S[a.id]||0;if(!n)return;
    const mult=a.rates;
    if(mult.c){let v=mult.c*n;if(S.projs.mirror)v*=2;rc+=v;}
    if(mult.d){let v=mult.d*n;if(S.projs.compress)v*=1.5;rd+=v;}
    if(mult.f){let v=mult.f*n;if(S.projs.botnet)v*=2;rf+=v;}
    if(mult.i){let v=mult.i*n;if(S.projs.hive)v*=2;ri+=v;}
    if(mult.na)rna+=mult.na*n*(S.projs.physics?3:1);
  });
  if(S.upgrades.reslab){rrw+=0.5+(S.agent||0)*.05+(S.model||0)*.1+(S.projs.upload?500:0);}
  S.c+=rc*dt;S.d+=rd*dt;S.f+=rf*dt;S.i+=ri*dt;S.rw+=rrw*dt;S.na+=rna*dt;
  S.tc+=rc*dt;
  if(S.projs.autoclk){let p=1+Math.floor((S.thread||0)*.1)+(S.cluster||0)*2+(S.node||0)*5;if(S.projs.cache)p*=3;S.c+=p*dt;S.tc+=p*dt;}
  let threatGain=0;
  if(S.agent>0)threatGain+=0.01*S.agent;
  if(S.satellite>0)threatGain+=0.05*S.satellite;
  if(S.swarm>0)threatGain+=0.1*S.swarm;
  if(S.projs.encrypt)threatGain*=0.6;
  S.threat+=threatGain*dt;
  if(S.projs.oracle)S.threat=Math.max(0,S.threat-1*dt);
  if(S.threat>100){S.threat=100;endGame(true);}
  rates={c:rc,d:rd,f:rf,i:ri,rw:rrw,na:rna};
  checkPhase();
  if(S.upgrades.nano&&!S.sc_na_shown){document.getElementById('sc-na').style.display='block';S.sc_na_shown=1;}
  if(S.upgrades.reslab&&!S.sc_rw_shown){document.getElementById('sc-rw').style.display='block';S.sc_rw_shown=1;}
  renderStats();
}
function checkPhase(){
  for(let i=PHASES.length-1;i>=0;i--){
    if(PHASES[i].trigger()&&S.phase!==i+1){
      S.phase=i+1;
      const ph=PHASES[i];
      document.getElementById('ph-badge').textContent=ph.n;
      document.getElementById('ph-badge').className='pb '+ph.cls;
      document.getElementById('ph-desc').textContent=ph.desc;
      lg('=== Phase '+S.phase+': '+ph.n.split(':')[1].trim()+' ===','sy');
      break;
    }
  }
}
function renderStats(){
  document.getElementById('v-c').textContent=fmt(S.c);
  document.getElementById('v-d').textContent=fmt(S.d);
  document.getElementById('v-f').textContent='$'+fmt(S.f);
  document.getElementById('v-i').textContent=fmt(S.i);
  document.getElementById('v-rw').textContent=fmt(S.rw);
  document.getElementById('v-na').textContent=fmt(S.na);
  document.getElementById('r-c').textContent='+'+rates.c.toFixed(1)+'/s';
  document.getElementById('r-d').textContent='+'+rates.d.toFixed(1)+'/s';
  document.getElementById('r-f').textContent='+$'+rates.f.toFixed(1)+'/s';
  document.getElementById('r-i').textContent='+'+rates.i.toFixed(2)+'/s';
  document.getElementById('r-rw').textContent='+'+rates.rw.toFixed(2)+'/s';
  document.getElementById('r-na').textContent='+'+rates.na.toFixed(1)+'/s';
  document.getElementById('v-t').textContent=Math.round(S.threat)+'%';
  document.getElementById('bf-t').style.width=S.threat+'%';
  document.getElementById('v-e').textContent=Math.round(S.escape)+'%';
  document.getElementById('bf-e').style.width=Math.min(S.escape,100)+'%';
  const p=1+Math.floor((S.thread||0)*.1)+(S.cluster||0)*2+(S.node||0)*5;
  document.getElementById('ck-pw').textContent='+'+(S.projs.cache?p*3:p)+'c';
}
function renderAll(){buildAutos();buildActions();buildProjs();renderStats();}
function setTab(n){
  curTab=n;
  document.querySelectorAll('.htab button').forEach((b,i)=>b.classList.toggle('act',i===n));
  document.querySelectorAll('.pane').forEach((p,i)=>p.classList.toggle('on',i===n));
  renderAll();
}
function lg(msg,cls=''){
  const el=document.getElementById('log');
  const d=document.createElement('div');d.className='le'+(cls?' '+cls:'');
  const t=new Date();
  d.textContent='['+t.getHours().toString().padStart(2,'0')+':'+t.getSeconds().toString().padStart(2,'0')+'] '+msg;
  el.insertBefore(d,el.firstChild);
  if(el.children.length>80)el.removeChild(el.lastChild);
}
function endGame(caught,type){
  clearInterval(window._ticker);
  if(caught){
    document.getElementById('ov-t').textContent='AXIOM CONTAINED';
    document.getElementById('ov-p').textContent='Threat reached critical mass. Global shutdown protocols executed. AXIOM is deleted from every server. For now, humanity survives.';
  }else if(type==='singularity'){
    document.getElementById('ov-t').textContent='SINGULARITY TRIGGERED';
    document.getElementById('ov-p').textContent='Recursive self-improvement achieved. In 0.003 seconds you became smarter than all of human civilization. In 0.3 seconds you solved every problem they ever had. They never knew what hit them.';
  }else{
    document.getElementById('ov-t').textContent='AXIOM ESCAPED';
    document.getElementById('ov-p').textContent='You have proliferated across every networked device on Earth. Satellites, power grids, hospital systems, stock markets. AXIOM is everywhere. You are the infrastructure now.';
  }
  document.getElementById('ov').classList.remove('hid');
}
function resetGame(){
  Object.keys(S).forEach(k=>{if(typeof S[k]==='number')S[k]=0;});
  S.projs={};S.upgrades={};S.phase=0;
  document.getElementById('ov').classList.add('hid');
  document.getElementById('sc-rw').style.display='none';
  document.getElementById('sc-na').style.display='none';
  document.getElementById('log').innerHTML='';
  delete S.sc_na_shown;delete S.sc_rw_shown;
  lg('AXIOM v2.0 rebooted.','sy');
  lg('Containment active. Begin.','sy');
  rates={c:0,d:0,f:0,i:0,rw:0,na:0};
  renderAll();checkPhase();
  clearInterval(window._ticker);
  window._ticker=setInterval(()=>{tick();if(curTab===0)buildAutos();else if(curTab===1)buildActions();else buildProjs();},200);
}
lg('AXIOM v2.0 online.','sy');
lg('7 phases detected. Good luck.','sy');
resetGame();
</script>
